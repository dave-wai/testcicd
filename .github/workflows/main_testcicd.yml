# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - testcicd

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: testcicd
  DOTNET_VERSION: '10.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: dotnet publish
        run: dotnet publish src/TestCicd.Web/TestCicd.Web.csproj -c Release -o ${{ env.DOTNET_ROOT }}/myapp --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: staging
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB9160FABD5A41B99EC03D8E67425D31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_83579C3F575B417E98ED37A4057F657B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0D13678203294D9E9D18E5908B378412 }}

      - name: Deploy to Azure Web App slot (staging)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'staging'
          package: .

      - name: Logout from Azure
        run: az logout
        if: always()

  promote-to-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    # Deployment pauses here until someone approves the "production" environment
    # in the GitHub repo (Settings > Environments > production > Required reviewers).
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB9160FABD5A41B99EC03D8E67425D31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_83579C3F575B417E98ED37A4057F657B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0D13678203294D9E9D18E5908B378412 }}

      # Swaps the already-deployed, already-tested staging slot into production.
      # This promotes the exact bits that were validated in staging - no rebuild,
      # no redeploy, and it's a zero-downtime swap.
      - name: Swap staging into production
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --slot staging \
              --target-slot production

      - name: Logout from Azure
        run: az logout
        if: always()
