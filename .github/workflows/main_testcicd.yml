# Docs: https://learn.microsoft.com/azure/container-apps/github-actions-cli
# Builds a container image, pushes it to GitHub Container Registry, then
# rolls it out to the QA Container App and, after approval, the Prod one.

name: Build and deploy container to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINERAPP_QA: testcicd-qa
  CONTAINERAPP_PROD: testcicd-prod

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read #This is required for actions/checkout
      packages: write #This is required for pushing to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record image reference
        id: meta
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy-qa:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment:
      name: qa
      url: https://${{ steps.deploy.outputs.fqdn }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB9160FABD5A41B99EC03D8E67425D31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_83579C3F575B417E98ED37A4057F657B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0D13678203294D9E9D18E5908B378412 }}

      - name: Deploy image to QA Container App
        id: deploy
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINERAPP_QA }} \
              --image ${{ needs.build-and-push-image.outputs.image }}
            # The quickstart placeholder image listens on port 80; the real app
            # listens on 8080, so make sure ingress matches it every deploy.
            az containerapp ingress update \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINERAPP_QA }} \
              --target-port 8080
            fqdn=$(az containerapp show \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINERAPP_QA }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Logout from Azure
        run: az logout
        if: always()

  promote-to-production:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-image
      - deploy-qa
    # Deployment pauses here until someone approves the "production" environment
    # in the GitHub repo (Settings > Environments > production > Required reviewers).
    environment:
      name: production
      url: https://${{ steps.deploy.outputs.fqdn }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CB9160FABD5A41B99EC03D8E67425D31 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_83579C3F575B417E98ED37A4057F657B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0D13678203294D9E9D18E5908B378412 }}

      # Deploys the exact same image digest that was already validated in QA -
      # no rebuild, just a rollout of a known-good image to the prod app.
      - name: Deploy image to Prod Container App
        id: deploy
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINERAPP_PROD }} \
              --image ${{ needs.build-and-push-image.outputs.image }}
            az containerapp ingress update \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINERAPP_PROD }} \
              --target-port 8080
            fqdn=$(az containerapp show \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINERAPP_PROD }} \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"

      - name: Logout from Azure
        run: az logout
        if: always()
